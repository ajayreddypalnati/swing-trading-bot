name: Test Momo Screener Scraper

on:
  workflow_dispatch: # Allows manual run button in GitHub Actions UI

jobs:
  run-momo-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas playwright playwright-stealth

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          python -m playwright install chromium
          sudo npx playwright install-deps chromium

      - name: Execute Momo Test Script
        run: python test_momo.py
